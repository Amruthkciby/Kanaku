name: Keep Supabase awake

# Supabase's free tier pauses a project after 7 days with no activity. This just needs to touch
# the database every so often -- it deploys nothing and is unrelated to the Netlify git
# integration, which handles all actual deploys on its own (see README "Deployment").
#
# Requires repo secrets SUPABASE_URL and SUPABASE_ANON_KEY, set once the hosted Supabase project
# exists (Settings -> API in the Supabase dashboard).

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Issue one trivial query against the project
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
